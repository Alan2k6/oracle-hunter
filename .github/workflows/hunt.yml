name: Hunt Oracle ARM VPS
on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  launch-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Cau hinh OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ap-singapore-1
          key_file=~/.oci/oci_api_key.pem
          EOF
          pip install -q oci-cli

      - name: Gui yeu cau tao VPS ARM
        run: |
          oci --no-retry compute instance launch \
            --availability-domain "KqYx:AP-SINGAPORE-1-AD-1" \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
            --display-name "VPS-Always-Free-ARM" \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --assign-public-ip true \
            --metadata '{"ssh_authorized_keys": "${{ secrets.OCI_SSH_PUBLIC_KEY }}"}'
